name: Bug report
description: Something in NexQ is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. A complete report is the fastest way to a fix.

        - **Security vulnerability?** Do not file it here. Follow [SECURITY.md](https://github.com/naxhq/NexQ/blob/main/SECURITY.md).
        - **Question or setup help?** Ask in [Discussions](https://github.com/naxhq/NexQ/discussions).
        - Please check that you are on the [latest release](https://github.com/naxhq/NexQ/releases/latest) and search [existing issues](https://github.com/naxhq/NexQ/issues?q=is%3Aissue) first.

        > [!IMPORTANT]
        > **Please include your log.** In NexQ, open **Settings → About → Diagnostics** and click **Copy recent log**, then paste it in the *Logs* field below. Most bugs can't be diagnosed without it. API keys are removed automatically and transcript text is never logged. [How to collect logs](https://github.com/naxhq/NexQ/blob/main/docs/user-guide/troubleshooting.md#collecting-logs-for-a-bug-report)

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a meeting with ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NexQ version
      description: Shown in Settings → About.
      placeholder: "e.g. 2.24.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - Other
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version and hardware
      description: Optional, but helpful for audio, GPU and local-model issues.
      placeholder: "e.g. Windows 11 24H2, Intel i7, no dedicated GPU / macOS 15.1, M2"

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Transcription (STT)
        - AI responses (LLM)
        - Audio capture / devices
        - Overlay
        - Launcher / meeting history
        - Settings
        - Context / RAG
        - Translation
        - Recording / playback
        - Stealth Mode
        - Updater / installer
        - Other
    validations:
      required: true

  - type: dropdown
    id: stt_provider
    attributes:
      label: STT provider(s)
      description: Select every provider involved ("You" and "Them" can differ).
      multiple: true
      options:
        - Web Speech
        - Windows Speech
        - Whisper.cpp
        - Parakeet TDT
        - ORT Streaming
        - Sherpa-ONNX
        - Deepgram
        - Groq Whisper
        - Whisper API (OpenAI)
        - Azure Speech
        - Not relevant

  - type: dropdown
    id: llm_provider
    attributes:
      label: LLM provider(s)
      multiple: true
      options:
        - Ollama
        - LM Studio
        - OpenAI
        - Anthropic
        - Google Gemini
        - Groq
        - OpenRouter
        - Claude (subscription)
        - Custom endpoint
        - Not relevant

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        **Settings → About → Diagnostics → Copy recent log**, then paste here. Or click **Open log folder** and drag `nexq.log` into the box below.
        - Can't reproduce reliably? Turn on **Verbose logging** in the same place, reproduce, then copy.
        - On a version before v2.27: in the meeting window press `Ctrl+Shift+L` and copy the Dev Log.
        - AI issues: the AI Call Log sidebar shows the request, provider, timing and error.
        [How to collect logs](https://github.com/naxhq/NexQ/blob/main/docs/user-guide/troubleshooting.md#collecting-logs-for-a-bug-report)
      placeholder: Paste the recent log here
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots, recordings or log files
      description: Drag and drop images, videos or `nexq.log` here.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am using the latest release, or I have confirmed the bug still exists on it.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I included my log, or explained why I can't.
          required: true
        - label: I checked logs and screenshots for personal information.
          required: true
